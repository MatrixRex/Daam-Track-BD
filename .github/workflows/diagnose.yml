name: Diagnostic Network Test

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Cloudflare WARP
        run: |
          echo "=== Installing Cloudflare WARP ==="
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-warp.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos connect || true
          sleep 5
          warp-cli --accept-tos status || true

      - name: Test IP After WARP
        run: |
          echo "=== RUNNER PUBLIC IP ==="
          curl -s https://api.ipify.org
          echo ""
          echo "=== IP GEOLOCATION ==="
          curl -s http://ip-api.com/json/
          echo ""

      - name: Test HTTP Connectivity
        run: |
          echo "=== CURL chaldal.com ==="
          curl -I --max-time 15 https://chaldal.com || echo "chaldal.com FAILED"
          echo ""
          echo "=== CURL catalog.chaldal.com ==="
          curl -I --max-time 15 https://catalog.chaldal.com || echo "catalog.chaldal.com FAILED"
          echo ""

      - name: Test Python Catalog Request
        run: |
          python3 -c "
          import requests
          payload = {
              'apiKey': 'e964fc2d51064efa97e94db7c64bf3d044279d4ed0ad4bdd9dce89fecc9156f0',
              'storeId': 1,
              'warehouseId': 8,
              'pageSize': 2,
              'currentPageIndex': 0,
              'metropolitanAreaId': 1,
              'query': '',
              'productVariantId': -1,
              'bundleId': {'case': 'None'},
              'canSeeOutOfStock': 'false',
              'filters': ['categories=11'],
              'maxOutOfStockCount': {'case': 'Some', 'fields': [5]},
              'shouldShowAlternateProductsForAllOutOfStock': {'case': 'Some', 'fields': [True]},
              'customerGuid': {'case': 'None'}
          }
          headers = {
              'Content-Type': 'application/json',
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',
              'Origin': 'https://chaldal.com',
              'Referer': 'https://chaldal.com/'
          }
          try:
              print('Testing https://catalog.chaldal.com/searchOld...')
              r = requests.post('https://catalog.chaldal.com/searchOld', json=payload, headers=headers, timeout=15)
              print(f'catalog.chaldal.com -> Status: {r.status_code}, Length: {len(r.text)}')
              if r.status_code == 200:
                  print('SUCCESS! Hits:', len(r.json().get('hits', [])))
          except Exception as e:
              print(f'catalog.chaldal.com -> ERROR: {e}')
          "
